server {
    listen 80;
    server_name _;

    # Optimize file uploads and timeouts
    client_max_body_size 64M;
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;

    # Headers for proxy
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # 1. Route WordPress Specific Paths to WordPress container
    # - wp-admin, wp-includes, wp-content, wp-json, wp-login.php, graphql
    location ~ ^/(wp-admin|wp-includes|wp-content|wp-json|wp-login\.php|graphql) {
        proxy_pass http://wordpress:80;
    }

    # 2. Proxy all PHP files directly to WordPress
    location ~ \.php$ {
        proxy_pass http://wordpress:80;
    }

    # 3. Route everything else to Next.js Frontend
    location / {
        proxy_pass http://frontend:3037;
    }
}
